[package]
name = "untracx-gui"
version = "0.1.0"
edition = "2021"

[lib]
name = "untracx_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "untracx-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
untracx = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zeroize = "1"

[package]
name = "untracx-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
untracx = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }
zeroize = "1"
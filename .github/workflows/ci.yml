name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            gui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock', 'gui/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check (core)
        run: cargo fmt --manifest-path core/Cargo.toml -- --check

      - name: Test (core)
        run: cargo test --manifest-path core/Cargo.toml --locked

      - name: Clippy (core)
        run: cargo clippy --manifest-path core/Cargo.toml --locked -- -D warnings

      - name: Format check (gui)
        run: cargo fmt --manifest-path gui/Cargo.toml -- --check

      - name: Clippy (gui)
        run: cargo clippy --manifest-path gui/Cargo.toml --locked -- -D warnings

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shell syntax + shellcheck
        run: |
          for script in server/*.sh scripts/*.sh; do
            bash -n "$script"
            shellcheck "$script"
          done

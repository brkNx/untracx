name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: untracx-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: untracx-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: untracx-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: untracx-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: untracx-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --manifest-path core/Cargo.toml --target ${{ matrix.target }} --release

      - name: Add Linux target artifacts
        if: startsWith(matrix.target, 'x86_64-unknown-linux-gnu') || startsWith(matrix.target, 'aarch64-unknown-linux-gnu')
        run: |
          mkdir -p dist-artifacts
          cp "core/target/${{ matrix.target }}/release/untracx" "dist-artifacts/${{ matrix.artifact }}"

      - name: Sign binary (macOS)
        if: runner.os == 'macOS' && env.CODESIGN_IDENTITY != ''
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          mkdir -p dist-artifacts
          if codesign --sign "$CODESIGN_IDENTITY" --force "core/target/${{ matrix.target }}/release/untracx"; then
            echo "codesign basarili"
          else
            echo "codesign basarisiz; imzasiizo devam"
          fi
          cp "core/target/${{ matrix.target }}/release/untracx" "dist-artifacts/${{ matrix.artifact }}"

      - name: Sign binary (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CERT != ''
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
        run: |
          mkdir -p dist-artifacts
          if osslsigncode sign \
            -pkcs12 "$WINDOWS_SIGNING_CERT" \
            -pass "$WINDOWS_SIGNING_PASS" \
            -in "core/target/${{ matrix.target }}/release/untracx.exe" \
            -out "dist-artifacts/${{ matrix.artifact }}" \
            -t http://timestamp.digicert.com; then
            echo "osslsigncode basarili"
          else
            echo "osslsigncode basarisiz; imzasiizo devam"
            cp "core/target/${{ matrix.target }}/release/untracx.exe" "dist-artifacts/${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-artifacts/
          if-no-files-found: error

  release:
    needs: build-and-sign
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'checksums.txt' -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
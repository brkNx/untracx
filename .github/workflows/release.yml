name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run without creating a GitHub release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build & Sign (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: untracx-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: untracx-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: untracx-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: untracx-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: untracx-windows-x86_64.exe

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 Cross Linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --manifest-path core/Cargo.toml --target ${{ matrix.target }} --locked --release

      - name: Prepare Artifact Directory
        shell: bash
        run: mkdir -p dist-artifacts

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        run: cp "core/target/${{ matrix.target }}/release/untracx" "dist-artifacts/${{ matrix.artifact }}"

      - name: Package & Sign macOS Binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          BINARY="core/target/${{ matrix.target }}/release/untracx"
          if [[ -n "$CODESIGN_IDENTITY" ]]; then
            codesign --sign "$CODESIGN_IDENTITY" --options runtime --force "$BINARY" || exit 1
          fi
          cp "$BINARY" "dist-artifacts/${{ matrix.artifact }}"

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: bash
        run: cp "core/target/${{ matrix.target }}/release/untracx.exe" "dist-artifacts/${{ matrix.artifact }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist-artifacts/
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v') && (github.event.inputs.dry_run != 'true')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums (SHA-256)
        shell: bash
        run: |
          cd dist
          sha256sum * > checksums.txt 2>/dev/null || true
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb872386006ae03c3d1971b # v2.2.1
        with:
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
